<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BabyTracker</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg" />
  <script>
    (function () {
      var stored = localStorage.getItem('theme');
      var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.classList.toggle('dark', dark);
    })();
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-white text-neutral-900 dark:bg-neutral-950 dark:text-neutral-100">
  <div class="mx-auto flex min-h-screen max-w-3xl flex-col px-6 py-10">
    <div id="app-nav"></div>

    <main id="dashboard" class="flex flex-1 flex-col items-center justify-center gap-6 text-center">
      <p class="text-sm text-neutral-500">Memuat...</p>
    </main>
  </div>

  <script src="js/config.js"></script>
  <script src="js/db.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/index.js"></script>
</body>
</html>
