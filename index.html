<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welcome</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-neutral-950 text-neutral-100">
  <div class="flex min-h-screen flex-col">
    <nav class="mx-auto flex w-full max-w-5xl items-center justify-between px-6 py-8">
      <span class="text-sm font-medium tracking-widest text-neutral-400">BRAND</span>
      <span class="h-1.5 w-1.5 rounded-full bg-orange-500"></span>
    </nav>

    <main class="flex flex-1 flex-col items-center justify-center px-6 text-center">
      <p class="mb-4 text-xs font-medium uppercase tracking-[0.3em] text-neutral-500">
        Welcome
      </p>
      <h1 class="max-w-2xl text-4xl font-semibold tracking-tight text-white sm:text-5xl md:text-6xl">
        Simple, focused,
        <span class="text-orange-500">built to last.</span>
      </h1>
      <p class="mt-6 max-w-md text-base text-neutral-400 sm:text-lg">
        A clean starting point with nothing extra. Just what you need to begin.
      </p>
      <a
        href="#"
        class="mt-10 inline-flex items-center gap-2 rounded-full border border-neutral-700 px-6 py-3 text-sm font-medium text-neutral-100 transition hover:border-orange-500 hover:text-orange-500"
      >
        Get Started
        <span aria-hidden="true">&rarr;</span>
      </a>
    </main>

    <footer class="mx-auto w-full max-w-5xl px-6 py-8 text-center text-xs text-neutral-600">
      &copy; 2026 Brand. All rights reserved.
    </footer>
  </div>
</body>
</html>
