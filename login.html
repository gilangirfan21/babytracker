<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Masuk</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg" />
  <script>
    (function () {
      var stored = localStorage.getItem('theme');
      var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.classList.toggle('dark', dark);
    })();
  </script>
  <script>
    tailwind.config = { darkMode: 'class' };
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-white text-neutral-900 dark:bg-neutral-950 dark:text-neutral-100">
  <div class="mx-auto flex min-h-screen max-w-sm flex-col justify-center px-6 py-10">
    <div class="mb-1 flex items-center justify-center gap-2">
      <img src="assets/logo.svg" alt="" class="h-6 w-6" />
      <p class="text-xs font-medium uppercase tracking-[0.3em] text-neutral-500">
        BabyTracker
      </p>
    </div>
    <h1 id="form-title" class="mb-8 text-center text-2xl font-semibold tracking-tight text-neutral-900 dark:text-white">
      Masuk
    </h1>

    <form id="auth-form" class="space-y-5 rounded-xl border border-neutral-200 p-6 dark:border-neutral-800">
      <label class="block">
        <span class="text-sm text-neutral-600 dark:text-neutral-400">Email</span>
        <input
          type="email" name="email" id="email" required autocomplete="email"
          class="mt-2 w-full rounded-lg border border-neutral-200 bg-white px-4 py-2.5 text-neutral-900 outline-none transition focus:border-orange-500 dark:border-neutral-800 dark:bg-neutral-900 dark:text-neutral-100"
        />
      </label>

      <label class="block">
        <span class="text-sm text-neutral-600 dark:text-neutral-400">Kata sandi</span>
        <input
          type="password" name="password" id="password" required minlength="6" autocomplete="current-password"
          class="mt-2 w-full rounded-lg border border-neutral-200 bg-white px-4 py-2.5 text-neutral-900 outline-none transition focus:border-orange-500 dark:border-neutral-800 dark:bg-neutral-900 dark:text-neutral-100"
        />
      </label>

      <button
        type="submit" id="submit-button"
        class="w-full rounded-full bg-orange-500 px-6 py-2.5 text-sm font-medium text-neutral-950 transition hover:bg-orange-400 disabled:opacity-50"
      >
        Masuk
      </button>

      <p id="status-bar" class="text-center text-sm text-neutral-500"></p>
    </form>

    <p class="mt-6 text-center text-sm text-neutral-500">
      <span id="toggle-prompt">Belum punya akun?</span>
      <button id="toggle-mode" type="button" class="font-medium text-orange-500 hover:text-orange-400">
        Daftar
      </button>
    </p>
  </div>

  <script src="js/config.js"></script>
  <script src="js/db.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
